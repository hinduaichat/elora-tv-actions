# ─────────────────────────────────────────────────────────────────────────────
# Elora Movie Site — Public Auto-Update Workflow (runs forever on free minutes)
#
# This workflow lives in a PUBLIC repo (unlimited free Actions minutes).
# It checks out the PRIVATE elora-tv repo using a PAT secret, runs the Python
# scripts that live in the private repo, commits/pushes the results back to the
# private repo. The push to the private repo's main branch automatically
# triggers Vercel production deploy via the project's GitHub integration
# (configured in Vercel dashboard) — no Vercel token needed here.
#
# SCHEDULES (Nepal Time = UTC + 5:45, so 23:59 Nepal = 18:14 UTC):
#   • Daily at 23:59 Nepal Time (18:14 UTC) — fetch NEW movies that appeared
#     in the FilmyFly sitemap since the last run, save their traces (with
#     poster + screenshot + mirrors), regenerate the catalog, push to
#     private repo → Vercel auto-deploys.
#   • Friday at 23:59 Nepal Time (18:14 UTC Friday) — refresh ALL fffast
#     download tokens (they expire after ~8 days), backfill screenshots for
#     any movies missing them, regenerate the catalog, push → Vercel auto-deploys.
#
# MANUAL DISPATCH: choose "new-movies", "refresh-links", "screenshots-only",
# or "both" via the workflow_dispatch input.
#
# SECRETS REQUIRED (set in repo settings → Secrets and variables → Actions):
#   PRIVATE_REPO_PAT   — GitHub PAT with repo scope on hinduaichat/elora-tv
#                         (used to checkout + push back to the private repo)
#
# No Vercel token needed — the private repo's Vercel project has GitHub
# integration enabled, so every push to main auto-triggers a production deploy.
# ─────────────────────────────────────────────────────────────────────────────
name: Elora Auto-Update

on:
  schedule:
    - cron: '14 18 * * *'        # Daily at 23:59 Nepal Time (18:14 UTC) — fetch new movies
    - cron: '14 18 * * 5'        # Friday at 23:59 Nepal Time (18:14 UTC Fri) — refresh all + backfill screenshots
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which job to run'
        required: false
        default: 'both'
        type: choice
        options:
          - new-movies
          - refresh-links
          - screenshots-only
          - both
      limit:
        description: 'Max movies to process (0 = unlimited)'
        required: false
        default: '100'
        type: string

permissions:
  contents: read

concurrency:
  group: elora-auto-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Debug — show trigger context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Mode (if manual): ${{ inputs.mode }}"
          echo "Limit (if manual): ${{ inputs.limit }}"

      - name: Determine which job to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHED="${{ github.event.schedule }}"
            if [ "$SCHED" = "14 18 * * 5" ]; then
              echo "mode=both" >> $GITHUB_OUTPUT   # Friday = refresh all + screenshots + new
            else
              echo "mode=new-movies" >> $GITHUB_OUTPUT  # Daily = only new movies
            fi
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PRIVATE elora-tv repo (using PAT secret)
        uses: actions/checkout@v4
        with:
          repository: hinduaichat/elora-tv
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: repo
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install requests urllib3 cloudscraper pynacl

      - name: Setup Git identity (for push back to private repo)
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ─────────────────────────────────────────────────────────────────────
      # Daily — fetch NEW movies from FilmyFly sitemap
      # (also extracts poster + screenshot + mirrors for each new movie)
      # ─────────────────────────────────────────────────────────────────────
      - name: Daily — fetch new movies from FilmyFly sitemap
        if: steps.mode.outputs.mode == 'new-movies' || steps.mode.outputs.mode == 'both'
        run: |
          cd repo
          LIMIT="${{ inputs.limit || '100' }}"
          echo "=== Fetching new movies (limit=$LIMIT) ==="
          python3 scripts/fetch_new_movies.py "$LIMIT" || echo "fetch had failures (non-fatal)"

      # ─────────────────────────────────────────────────────────────────────
      # Friday — refresh ALL download links + backfill screenshots
      # ─────────────────────────────────────────────────────────────────────
      - name: Friday — refresh all download links
        if: steps.mode.outputs.mode == 'refresh-links' || steps.mode.outputs.mode == 'both'
        run: |
          cd repo
          echo "=== Refreshing all fffast download tokens ==="
          python3 scripts/refresh_all_links.py || echo "refresh had failures (non-fatal)"

      # ─────────────────────────────────────────────────────────────────────
      # Backfill screenshots — add screenshot_url to any trace missing it
      # ─────────────────────────────────────────────────────────────────────
      - name: Backfill screenshots for movies missing them
        if: steps.mode.outputs.mode == 'refresh-links' || steps.mode.outputs.mode == 'both' || steps.mode.outputs.mode == 'screenshots-only'
        run: |
          cd repo
          echo "=== Backfilling screenshots (parallel, 20 workers) ==="
          python3 scripts/backfill_screenshots.py --workers=20 || echo "backfill had failures (non-fatal)"

      # ─────────────────────────────────────────────────────────────────────
      # Regenerate movies-data.ts catalog (includes screenshot_url field)
      # ─────────────────────────────────────────────────────────────────────
      - name: Regenerate catalog (movies-data.ts)
        run: |
          cd repo
          echo "=== Regenerating movies-data.ts ==="
          python3 scripts/generate_movies_data.py

      # ─────────────────────────────────────────────────────────────────────
      # Commit & push to PRIVATE repo — triggers Vercel auto-deploy
      # ─────────────────────────────────────────────────────────────────────
      - name: Commit & push to private repo (auto-triggers Vercel deploy)
        run: |
          cd repo
          git add src/lib/data/traces-live/ src/lib/movies-data.ts
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update via public-repo workflow [auto]

            Triggered by: hinduaichat/elora-tv-actions/.github/workflows/auto-update.yml
            Run: ${{ github.run_id }}
            Mode: ${{ steps.mode.outputs.mode }}" || true
            git push https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/hinduaichat/elora-tv.git HEAD:main 2>&1 | sed "s|x-access-token:[^@]*@|x-access-token:***@|g" || echo "push failed (non-fatal)"
            echo "✓ Pushed to private repo → Vercel will auto-deploy from main"
          else
            echo "ℹ No changes to push (catalog already up to date)"
          fi
