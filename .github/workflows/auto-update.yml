# ─────────────────────────────────────────────────────────────────────────────
# Elora Movie Site — Public Auto-Update Workflow (runs forever on free minutes)
#
# This workflow lives in a PUBLIC repo (unlimited free Actions minutes).
# It checks out the PRIVATE elora-tv repo using a PAT secret, runs the Python
# scripts that live in the private repo, commits/pushes the results back to the
# private repo, and triggers a Vercel production deploy.
#
# SCHEDULES:
#   • Every day at 00:00 UTC — fetch NEW movies that appeared in the FilmyFly
#     sitemap since the last run, save their traces, regenerate the catalog,
#     push to private repo, redeploy Vercel.
#   • Every Friday at 00:00 UTC — refresh ALL fffast download tokens (they
#     expire after ~8 days), regenerate the catalog, push, redeploy.
#
# MANUAL DISPATCH: choose "new-movies", "refresh-links", or "both" via the
# workflow_dispatch input.
#
# SECRETS REQUIRED (set in repo settings → Secrets and variables → Actions):
#   PRIVATE_REPO_PAT   — GitHub PAT with repo+workflow scope on hinduaichat/elora-tv
#   VERCEL_TOKEN       — Vercel access token (deploy scope)
#   VERCEL_PROJECT_ID  — e.g. prj_xxxxxxxxxxxxxxxxx
#   VERCEL_ORG_ID      — e.g. team_xxxxxxxxxxxxxxxx
#
# No secrets or API keys are ever written to this file. All sensitive values
# are referenced via ${{ secrets.* }} which GitHub masks in logs.
# ─────────────────────────────────────────────────────────────────────────────
name: Elora Auto-Update

on:
  schedule:
    - cron: '0 0 * * *'        # Daily at 00:00 UTC — fetch new movies
    - cron: '0 0 * * 5'        # Friday at 00:00 UTC — refresh all download links
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which job to run'
        required: false
        default: 'both'
        type: choice
        options:
          - new-movies
          - refresh-links
          - both
      limit:
        description: 'Max movies to process (0 = unlimited)'
        required: false
        default: '100'
        type: string

# Public repo only needs read access to itself; the PAT is used explicitly
# inside the steps for the private repo.
permissions:
  contents: read

# Concurrent runs waste minutes — cancel any in-progress when a new run starts
concurrency:
  group: elora-auto-update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Debug — show trigger context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Mode (if manual): ${{ inputs.mode }}"
          echo "Limit (if manual): ${{ inputs.limit }}"

      - name: Determine which job to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SCHED="${{ github.event.schedule }}"
            if [ "$SCHED" = "0 0 * * 5" ]; then
              echo "mode=both" >> $GITHUB_OUTPUT   # Friday = refresh all + fetch new
            else
              echo "mode=new-movies" >> $GITHUB_OUTPUT  # Daily = only new movies
            fi
          else
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PRIVATE elora-tv repo (using PAT secret)
        uses: actions/checkout@v4
        with:
          repository: hinduaichat/elora-tv
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: repo
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install requests urllib3 cloudscraper pynacl

      - name: Setup Git identity (for push back to private repo)
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Use the PAT as the credential helper (avoids embedding token in URLs)
          git config remote.origin.https-header "Authorization: bearer ${{ secrets.PRIVATE_REPO_PAT }}"

      # ─────────────────────────────────────────────────────────────────────
      # Step: Fetch NEW movies that appeared in sitemap (runs daily + Friday)
      # ─────────────────────────────────────────────────────────────────────
      - name: Daily — fetch new movies from FilmyFly sitemap
        if: steps.mode.outputs.mode == 'new-movies' || steps.mode.outputs.mode == 'both'
        run: |
          cd repo
          LIMIT="${{ inputs.limit || '100' }}"
          echo "=== Fetching new movies (limit=$LIMIT) ==="
          python3 scripts/fetch_new_movies.py "$LIMIT" || echo "fetch had failures (non-fatal)"

      # ─────────────────────────────────────────────────────────────────────
      # Step: Refresh ALL download links (runs Friday only)
      # fffast tokens expire ~8 days after creation. Re-trace every movie to
      # get fresh tokens so download links stay working through next Saturday.
      # ─────────────────────────────────────────────────────────────────────
      - name: Friday — refresh all download links
        if: steps.mode.outputs.mode == 'refresh-links' || steps.mode.outputs.mode == 'both'
        run: |
          cd repo
          echo "=== Refreshing all fffast download tokens ==="
          python3 scripts/refresh_all_links.py || echo "refresh had failures (non-fatal)"

      # ─────────────────────────────────────────────────────────────────────
      # Step: Regenerate movies-data.ts catalog with fresh sitemap_index
      # ─────────────────────────────────────────────────────────────────────
      - name: Regenerate catalog (movies-data.ts)
        run: |
          cd repo
          echo "=== Regenerating movies-data.ts ==="
          python3 scripts/generate_movies_data.py

      # ─────────────────────────────────────────────────────────────────────
      # Step: Commit & push to PRIVATE repo (using PAT secret via credential helper)
      # ─────────────────────────────────────────────────────────────────────
      - name: Commit & push to private repo
        run: |
          cd repo
          git add src/lib/data/traces-live/ src/lib/movies-data.ts
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update via public-repo workflow [auto]

            Triggered by: hinduaichat/elora-tv-actions/.github/workflows/auto-update.yml
            Run: ${{ github.run_id }}
            Mode: ${{ steps.mode.outputs.mode }}" || true
            # Push using the PAT (avoids showing token in URL)
            git push https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/hinduaichat/elora-tv.git HEAD:main 2>&1 | sed "s|x-access-token:[^@]*@|x-access-token:***@|g" || echo "push failed (non-fatal)"
            echo "✓ Pushed updated traces + catalog"
          else
            echo "ℹ No changes to push (catalog already up to date)"
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Step: Trigger Vercel production deploy
      # Uses vercel CLI with the stored project ID + org ID so deploys go to
      # the existing project (not a new one). Moves .git away to avoid the
      # "fake git SHA" BLOCKED issue we hit earlier.
      # ─────────────────────────────────────────────────────────────────────
      - name: Trigger Vercel production deploy
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "WARN: VERCEL_TOKEN or VERCEL_PROJECT_ID or VERCEL_ORG_ID not set, skipping Vercel deploy"
            exit 0
          fi
          # Install vercel CLI silently
          npm install -g vercel --silent 2>&1 | tail -3
          
          cd repo
          # Create .vercel/project.json so vercel CLI targets the existing project
          mkdir -p .vercel
          cat > .vercel/project.json << EOF
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID"}
          EOF
          
          # Move .git away so vercel CLI doesn't embed a fake/stale git SHA in the deploy
          # (Vercel was BLOCKING deploys with non-verified git SHAs.)
          mv .git /tmp/repo-git-backup
          
          # Deploy
          echo "=== Deploying to Vercel production ==="
          vercel deploy --prod --token "$VERCEL_TOKEN" --yes 2>&1 | tail -15 || echo "Vercel deploy failed (non-fatal)"
          
          # Restore .git (clean state for any later steps)
          mv /tmp/repo-git-backup .git
